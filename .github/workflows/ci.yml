name: CI

# Landing-page-only changes don't touch the app, so they skip CI (site.yml publishes them).
# The macOS job runs on pushes to main and on demand (Actions > CI > Run workflow, pick the branch),
# not on every pull request: on a private repo macOS minutes count 10x against the Actions quota.
# Run it on demand when a pull request needs its screenshots or the app bundle.
on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '.github/workflows/site.yml', 'scripts/deploy-site.sh']
  pull_request:
    paths-ignore: ['site/**', '.github/workflows/site.yml', 'scripts/deploy-site.sh']
  workflow_dispatch:

jobs:
  macos:
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test
      - name: Build the app bundle (universal, ad hoc signed)
        run: OUTPUT=dist scripts/build-app.sh
      - name: Check the bundle
        run: |
          plutil -p dist/Wiretide.app/Contents/Info.plist
          test -s dist/Wiretide.app/Contents/Resources/AppIcon.icns
          lipo -archs dist/Wiretide.app/Contents/MacOS/Wiretide
          lipo -archs dist/Wiretide.app/Contents/MacOS/WiretideHelper
          plutil -lint dist/Wiretide.app/Contents/Library/LaunchDaemons/app.wiretide.Wiretide.Helper.plist
          codesign -dv dist/Wiretide.app/Contents/MacOS/WiretideHelper 2>&1 | grep Identifier=app.wiretide.Wiretide.Helper
          otool -l dist/Wiretide.app/Contents/MacOS/Wiretide | grep -A2 LC_RPATH
      - name: Screenshots (from the bundle, so Sparkle and rpath load as in a release)
        timeout-minutes: 6
        run: dist/Wiretide.app/Contents/MacOS/Wiretide --screenshots screenshots
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Wiretide-app
          path: dist/*.zip
          retention-days: 14
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the app icon
        uses: actions/upload-artifact@v4
        with:
          name: app-icon
          path: dist/Wiretide.app/Contents/Resources/AppIcon.icns
          retention-days: 14

  linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite and zlib headers
        run: apt-get update && apt-get install -y libsqlite3-dev zlib1g-dev
      - name: Test
        run: swift test
