name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test
      - name: Build the app bundle (universal, ad hoc signed)
        run: OUTPUT=dist scripts/build-app.sh
      - name: Check the bundle
        run: |
          plutil -p dist/TrafficWatcher.app/Contents/Info.plist
          lipo -archs dist/TrafficWatcher.app/Contents/MacOS/TrafficWatcher
          otool -l dist/TrafficWatcher.app/Contents/MacOS/TrafficWatcher | grep -A2 LC_RPATH
      - name: Screenshots (from the bundle, so Sparkle and rpath load as in a release)
        timeout-minutes: 6
        run: dist/TrafficWatcher.app/Contents/MacOS/TrafficWatcher --screenshots screenshots
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: TrafficWatcher-app
          path: dist/*.zip
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: warn

  linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite headers
        run: apt-get update && apt-get install -y libsqlite3-dev
      - name: Test
        run: swift test
