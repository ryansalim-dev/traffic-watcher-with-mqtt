name: Site

# Publishes the landing page in site/ to https://wiretide.app on Cloudflare Pages.
# The gh-pages branch holds the built site next to the Sparkle appcast that release.yml writes
# there; files this workflow doesn't own (appcast.xml, CNAME) are left alone. The whole branch is
# then deployed with scripts/deploy-site.sh, so the appcast is always served alongside the site.
#
# Repository secrets: CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit), CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml', 'scripts/deploy-site.sh']
  workflow_dispatch:

permissions:
  contents: write

# Same group as release.yml, so the two never push gh-pages at the same time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin gh-pages; then
            git worktree add pages origin/gh-pages
            git -C pages switch -c gh-pages
          else
            git worktree add --orphan -b gh-pages pages
          fi

      - name: Copy the site
        run: |
          find pages -mindepth 1 -maxdepth 1 ! -name .git ! -name appcast.xml ! -name CNAME -exec rm -rf {} +
          cp -a site/. pages/
          cd pages
          git add -A
          if git diff --cached --quiet; then
            echo "Site unchanged."
          else
            git commit -m "Site from ${GITHUB_SHA::7}"
            git push origin gh-pages
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/deploy-site.sh pages
